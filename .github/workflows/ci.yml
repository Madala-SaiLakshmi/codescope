name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codescope
          POSTGRES_PASSWORD: codescope
          POSTGRES_DB: codescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codescope"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codescope:codescope@localhost:5432/codescope
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create test database
        run: PGPASSWORD=codescope psql -h localhost -U codescope -d codescope -c "CREATE DATABASE codescope_test;"
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

services:
  db:
    image: postgres:16
    container_name: codescope-db
    environment:
      POSTGRES_USER: codescope
      POSTGRES_PASSWORD: codescope
      POSTGRES_DB: codescope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codescope"]
      interval: 5s
      retries: 10

volumes:
  pgdata: